<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Defender: RPG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startScreen" class="screen">
        <h1>COSMIC DEFENDER</h1>
        <p class="subtitle">RPG Edition</p>
        <p id="controlInstructions">PC: Arrow Keys & Space | Mobile: Touch & Drag</p>
        <div id="difficultySelection">
            <button class="difficulty-btn selected" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn" data-difficulty="normal">Normal</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            <button class="difficulty-btn" data-difficulty="insane">Insane</button>
        </div>
        <p id="welcomeMessage">Relax, rookie!</p>
        <button id="startBtn">START GAME</button>
    </div>

    <div id="gameUI" style="display: none;">
        <div id="statsPanel">
            <div class="stat-line">SCORE: <span id="ui-score">0</span></div>
            <div class="stat-line">WAVE: <span id="ui-wave">1</span> / 20</div>
            <div class="stat-line text-red">HULL: <span id="ui-lives">❤️❤️❤️❤️❤️</span></div>
            <div class="rpg-panel">
                <div>LVL: <span id="ui-level">1</span></div>
                <div class="xp-bar-bg"><div id="ui-xp-fill"></div></div>
            </div>
        </div>

        <div id="powerupStatus">
            <span id="ui-rapid">RAPID</span>
            <span id="ui-triple">TRIPLE</span>
            <span id="ui-shield">SHIELD</span>
        </div>

        <div id="controlPanel">
            <button id="pauseBtn" class="icon-btn">⏸</button>
            <button id="homeBtn" class="icon-btn">🏠</button>
        </div>

        <div id="bossHealthContainer" style="display: none;">
            <div>BOSS HULL</div>
            <div class="boss-bar-bg"><div id="boss-health-fill"></div></div>
        </div>
    </div>

    <div id="pauseScreen" class="screen" style="display: none;">
        <h1>PAUSED</h1>
        <button id="resumeBtn">RESUME</button>
    </div>

    <div id="gameOverScreen" class="screen" style="display: none;">
        <h1 class="text-red">SYSTEM FAILURE</h1>
        <p>Final Score: <span id="end-score">0</span></p>
        <p>Waves Survived: <span id="end-wave">0</span></p>
        <p>Ship Level: <span id="end-level">1</span></p>
        <button class="restartBtn">REBOOT SYSTEM</button>
    </div>

    <div id="winScreen" class="screen" style="display: none;">
        <h1 class="text-green">GALAXY SAVED</h1>
        <p>Final Score: <span id="win-score">0</span></p>
        <p>Ship Level: <span id="win-level">1</span></p>
        <button class="restartBtn">PLAY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
